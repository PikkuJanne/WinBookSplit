name: Diagnostic shell timing only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-shadow-inbox:
    name: Diagnostic shadow inbox 5.1 (no acceptance)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout fixed reviewed source R
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: '001669a051077536864b3f787ca0ec111fe06013'
          persist-credentials: false
          clean: false
          set-safe-directory: false
          fetch-depth: 0

      - name: Set up exact isolated fixture driver
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          architecture: x64
          freethreaded: false
          allow-prereleases: false

      - name: Prepare owned diagnostic tools and authenticate shadow transformer
        run: |
          $ErrorActionPreference = 'Stop'
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-shell-diagnostic'
          if (Test-Path -LiteralPath $CiRoot) { throw 'Diagnostic root already exists.' }
          $null = New-Item -ItemType Directory -Path (Join-Path $CiRoot 'reports')
          Get-ChildItem Env:PIP_* | Remove-Item
          $env:PIP_CONFIG_FILE = 'nul'
          python -I -B -c "import struct,sys; assert sys.version_info[:3]==(3,14,8) and struct.calcsize('P')==8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -m venv (Join-Path $CiRoot 'venv')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiPython = Join-Path $CiRoot 'venv\Scripts\python.exe'
          & $CiPython -I -B -m pip install --isolated --disable-pip-version-check --no-input --no-cache-dir --require-hashes --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $CiPython -I -B -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $CiPython -I -B tools/ci/bootstrap.py --tool-root (Join-Path $CiRoot 'tools') --report (Join-Path $CiRoot 'reports\tools-bootstrap.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiWheels = Join-Path $CiRoot 'wheelhouse'
          $null = New-Item -ItemType Directory -Path $CiWheels
          & $CiPython -I -B -m pip download --isolated --disable-pip-version-check --no-input --no-cache-dir --no-deps --require-hashes --only-binary=:all: -r requirements.txt --dest $CiWheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WBS_DIAGNOSTIC_ROOT = $CiRoot
          & $CiPython -I -B -c "import os,re,subprocess;from pathlib import Path;from hashlib import sha256;c=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',c);e={k:v for k,v in os.environ.items() if not k.upper().startswith('GIT_')};e.update(GIT_NO_REPLACE_OBJECTS='1',GIT_TERMINAL_PROMPT='0');b=subprocess.run(['git','show',c+':tools/ci/diagnose_shell_timeout.py'],env=e,stdin=subprocess.DEVNULL,capture_output=True,timeout=60,check=True).stdout;assert len(b)<65536 and sha256(b).hexdigest()=='e2025f36344d5ec26ff3ab4ec3ebf1bd67d05ce9ca9f363d8afc308eec87c0d8';p=Path(os.environ['WBS_DIAGNOSTIC_ROOT'])/'diagnose_shell_timeout.py';p.open('xb').write(b)"
          exit $LASTEXITCODE

      - name: Run diagnostic-only shadow with unchanged 300-second shell bound
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-shell-diagnostic'
          $CiPython = Join-Path $CiRoot 'venv\Scripts\python.exe'
          $env:WBS_TEST_WHEELHOUSE = Join-Path $CiRoot 'wheelhouse'
          & $CiPython -I -B (Join-Path $CiRoot 'diagnose_shell_timeout.py') --tool-root (Join-Path $CiRoot 'tools') --reports (Join-Path $CiRoot 'reports')
          exit $LASTEXITCODE

      - name: Preserve only diagnostic shadow timing and source receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostic-only-shell-R001669a-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/WinBookSplit-shell-diagnostic/reports/tools-bootstrap.json
            ${{ runner.temp }}/WinBookSplit-shell-diagnostic/reports/diagnostic.json
            ${{ runner.temp }}/WinBookSplit-shell-diagnostic/reports/phase.jsonl
            ${{ runner.temp }}/WinBookSplit-shell-diagnostic/reports/shadow-report.json
            ${{ runner.temp }}/WinBookSplit-shell-diagnostic/work/phase.jsonl
            ${{ runner.temp }}/WinBookSplit-shell-diagnostic/work/report.json
          retention-days: 14
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error
