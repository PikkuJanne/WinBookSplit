name: Windows CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-regression:
    name: Python and PowerShell regression (Windows Server 2025)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          clean: false
          set-safe-directory: false
          fetch-depth: 0

      - name: Create owned report directory
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-ci'
          if (Test-Path -LiteralPath $CiRoot) { throw 'CI directory already exists' }
          $null = New-Item -ItemType Directory -Path (Join-Path $CiRoot 'reports')
          $CiOS = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          $CiCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiOSRecord = [ordered]@{schema_version=1;source_commit=$CiCommit;caption=[string]$CiOS.Caption;version=[string]$CiOS.Version;build=[string]$CiOS.BuildNumber;architecture=[string]$CiOS.OSArchitecture;product_type=[int]$CiOS.ProductType;process_bits=([IntPtr]::Size*8);powershell=$PSVersionTable.PSVersion.ToString();clr=[Environment]::Version.ToString();image_os=$env:ImageOS;image_version=$env:ImageVersion;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT}
          $CiOSPath = Join-Path $CiRoot 'reports\os.json'
          $CiStream = [IO.File]::Open($CiOSPath,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try {
            $CiBytes = [Text.Encoding]::UTF8.GetBytes(($CiOSRecord | ConvertTo-Json -Depth 4))
            $CiStream.Write($CiBytes,0,$CiBytes.Length)
          } finally { $CiStream.Dispose() }

      - name: Set up exact regular x64 Python
        id: python-setup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          architecture: x64
          freethreaded: false
          allow-prereleases: false

      - name: Install hash-pinned development dependencies in a fresh venv
        id: dependencies
        run: |
          Get-ChildItem Env:PIP_* | Remove-Item
          $env:PIP_CONFIG_FILE = 'nul'
          python -I -B -c "import struct,sys; assert sys.version_info[:3] == (3,14,8) and struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiVenv = Join-Path $env:RUNNER_TEMP 'WinBookSplit-ci\venv'
          python -I -B -m venv $CiVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiPython = Join-Path $CiVenv 'Scripts\python.exe'
          & $CiPython -I -B -m pip install --isolated --disable-pip-version-check --no-input --no-cache-dir --require-hashes --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $CiPython -I -B -m pip check
          exit $LASTEXITCODE

      - name: Bootstrap exact isolated shell tools
        id: modules
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-ci'
          $CiPython = Join-Path $CiRoot 'venv\Scripts\python.exe'
          & $CiPython -I -B tools/ci/bootstrap.py --tool-root (Join-Path $CiRoot 'tools') --report (Join-Path $CiRoot 'reports\tools-bootstrap.json')
          exit $LASTEXITCODE

      - name: Check committed package prerequisites without building a package
        if: ${{ !cancelled() && steps.python-setup.outcome == 'success' }}
        run: |
          $CiCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiReport = Join-Path $env:RUNNER_TEMP 'WinBookSplit-ci\reports\package-inputs.json'
          python -I -B tools/ci/check_package_inputs.py --repo $env:GITHUB_WORKSPACE --commit $CiCommit --report $CiReport
          exit $LASTEXITCODE

      - name: Python regression through the shared runner
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-ci'
          $CiPython = Join-Path $CiRoot 'venv\Scripts\python.exe'
          & $CiPython -I -B tests/run_tests.py --layer python --report (Join-Path $CiRoot 'reports\python.json')
          exit $LASTEXITCODE

      - name: Windows PowerShell 5.1 syntax, scoped analysis and Pester
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.modules.outcome == 'success' }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-ci'
          $CiPython = Join-Path $CiRoot 'venv\Scripts\python.exe'
          $CiShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $CiPython -I -B tests/run_tests.py --layer shell --shell-path $CiShell --tool-root (Join-Path $CiRoot 'tools') --report (Join-Path $CiRoot 'reports\shell-ps51.json')
          exit $LASTEXITCODE

      - name: PowerShell 7 syntax, scoped analysis and Pester
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.modules.outcome == 'success' }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-ci'
          $CiPython = Join-Path $CiRoot 'venv\Scripts\python.exe'
          $CiShell = (Get-Command pwsh -CommandType Application -ErrorAction Stop).Source
          & $CiPython -I -B tests/run_tests.py --layer shell --shell-path $CiShell --tool-root (Join-Path $CiRoot 'tools') --report (Join-Path $CiRoot 'reports\shell-ps7.json')
          exit $LASTEXITCODE

      - name: Require all source-bound reference reports
        if: ${{ !cancelled() }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-ci'
          $CiPython = Join-Path $CiRoot 'venv\Scripts\python.exe'
          $CiCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $CiPython -I -B tools/ci/validate_reports.py --role reference --commit $CiCommit --reports (Join-Path $CiRoot 'reports')
          exit $LASTEXITCODE

      - name: Preserve only declared synthetic test and prerequisite reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/WinBookSplit-ci/reports/os.json
            ${{ runner.temp }}/WinBookSplit-ci/reports/tools-bootstrap.json
            ${{ runner.temp }}/WinBookSplit-ci/reports/package-inputs.json
            ${{ runner.temp }}/WinBookSplit-ci/reports/python.json
            ${{ runner.temp }}/WinBookSplit-ci/reports/shell-ps51.json
            ${{ runner.temp }}/WinBookSplit-ci/reports/shell-ps7.json
          retention-days: 14
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error

  windows-application:
    name: Application ${{ matrix.python }} (Windows Server 2025)
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.13.16', '3.14.8']
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          clean: false
          set-safe-directory: false
          fetch-depth: 0

      - name: Set up exact fixture-driver Python
        id: driver
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          architecture: x64
          freethreaded: false
          allow-prereleases: false

      - name: Set up exact application test target
        id: application
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          freethreaded: false
          allow-prereleases: false

      - name: Create separate owned driver and runtime environments
        id: dependencies
        env:
          WBS_DRIVER_PYTHON: ${{ steps.driver.outputs.python-path }}
          WBS_APPLICATION_PYTHON: ${{ steps.application.outputs.python-path }}
          WBS_APPLICATION_VERSION: ${{ matrix.python }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-application'
          if (Test-Path -LiteralPath $CiRoot) { throw 'Application CI directory already exists' }
          $null = New-Item -ItemType Directory -Path (Join-Path $CiRoot 'reports')
          $CiOS = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          $CiCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiOSRecord = [ordered]@{schema_version=1;source_commit=$CiCommit;caption=[string]$CiOS.Caption;version=[string]$CiOS.Version;build=[string]$CiOS.BuildNumber;architecture=[string]$CiOS.OSArchitecture;product_type=[int]$CiOS.ProductType;process_bits=([IntPtr]::Size*8);powershell=$PSVersionTable.PSVersion.ToString();clr=[Environment]::Version.ToString();image_os=$env:ImageOS;image_version=$env:ImageVersion;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT}
          $CiOSPath = Join-Path $CiRoot 'reports\os.json'
          $CiStream = [IO.File]::Open($CiOSPath,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try {
            $CiBytes = [Text.Encoding]::UTF8.GetBytes(($CiOSRecord | ConvertTo-Json -Depth 4))
            $CiStream.Write($CiBytes,0,$CiBytes.Length)
          } finally { $CiStream.Dispose() }
          Get-ChildItem Env:PIP_* | Remove-Item
          $env:PIP_CONFIG_FILE = 'nul'
          & $env:WBS_DRIVER_PYTHON -I -B -m venv --copies (Join-Path $CiRoot 'driver')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:WBS_APPLICATION_PYTHON -I -B -c "import platform,struct,sys; assert platform.python_implementation()=='CPython' and struct.calcsize('P')==8 and sys.version_info.releaselevel=='final'; assert '.'.join(map(str,sys.version_info[:3]))==sys.argv[1]" $env:WBS_APPLICATION_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:WBS_APPLICATION_PYTHON -I -B -m venv --copies (Join-Path $CiRoot 'runtime')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiDriver = Join-Path $CiRoot 'driver\Scripts\python.exe'
          $CiRuntime = Join-Path $CiRoot 'runtime\Scripts\python.exe'
          & $CiDriver -I -B -m pip install --isolated --disable-pip-version-check --no-input --no-cache-dir --require-hashes --only-binary=:all: -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $CiDriver -I -B -m pip download --isolated --disable-pip-version-check --no-input --no-cache-dir --no-deps --require-hashes --only-binary=:all: -r requirements.txt --dest (Join-Path $CiRoot 'wheelhouse')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $CiRuntime -I -B -m pip install --isolated --disable-pip-version-check --no-input --no-cache-dir --no-deps --require-hashes --only-binary=:all: --no-index --find-links (Join-Path $CiRoot 'wheelhouse') -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $CiRuntime -I -B -m pip check
          exit $LASTEXITCODE

      - name: Check source and runtime-matrix coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          WBS_APPLICATION_VERSION: ${{ matrix.python }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-application'
          $CiDriver = Join-Path $CiRoot 'driver\Scripts\python.exe'
          & $CiDriver -I -B -c "import json,sys; from pathlib import Path; lock=json.loads(Path('tests/compatibility/runtime-lock.json').read_bytes()); policy=json.loads(Path('engine/WinBookSplit.Compatibility.json').read_bytes()); assert lock['python_versions']==['3.13.16','3.14.8']; assert sorted({tuple(map(int,v.split('.')[:2])) for v in lock['python_versions']})==sorted({(b['major'],b['minor']) for b in policy['python']['branches']}); assert sys.argv[1] in lock['python_versions']" $env:WBS_APPLICATION_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $CiDriver -I -B tools/ci/check_package_inputs.py --repo $env:GITHUB_WORKSPACE --commit $CiCommit --report (Join-Path $CiRoot 'reports\package-inputs.json')
          exit $LASTEXITCODE

      - name: Run actual runtime-only application matrix
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-application'
          $CiDriver = Join-Path $CiRoot 'driver\Scripts\python.exe'
          $CiRuntime = Join-Path $CiRoot 'runtime\Scripts\python.exe'
          $CiShell51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $CiShell7 = (Get-Command pwsh -CommandType Application -ErrorAction Stop).Source
          & $CiDriver -I -B tests/run_tests.py --layer application --application-python-path $CiRuntime --shell-path $CiShell51 --shell-path $CiShell7 --report (Join-Path $CiRoot 'reports\application.json')
          exit $LASTEXITCODE

      - name: Require all source-bound application reports
        if: ${{ !cancelled() }}
        env:
          WBS_APPLICATION_VERSION: ${{ matrix.python }}
        run: |
          $CiRoot = Join-Path $env:RUNNER_TEMP 'WinBookSplit-application'
          $CiCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $CiDriver = Join-Path $CiRoot 'driver\Scripts\python.exe'
          & $CiDriver -I -B tools/ci/validate_reports.py --role application --commit $CiCommit --python-version $env:WBS_APPLICATION_VERSION --reports (Join-Path $CiRoot 'reports')
          exit $LASTEXITCODE

      - name: Preserve declared application reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-application-${{ matrix.python }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/WinBookSplit-application/reports/package-inputs.json
            ${{ runner.temp }}/WinBookSplit-application/reports/os.json
            ${{ runner.temp }}/WinBookSplit-application/reports/application.json
          retention-days: 14
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error
